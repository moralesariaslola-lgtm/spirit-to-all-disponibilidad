<text x="413" y="58" fill="#2d2019" font-family="Arial,sans-serif" font-size="20" font-weight="700">🔑 Llaves de acceso</text>
<text x="413" y="95" fill="#40352f" font-family="Arial,sans-serif" font-size="15">Registra este dispositivo con la</text><text x="413" y="119" fill="#40352f" font-family="Arial,sans-serif" font-size="15">huella, cara, PIN o patrón que</text><text x="413" y="143" fill="#40352f" font-family="Arial,sans-serif" font-size="15">ofrezca el móvil.</text>
<rect x="412" y="166" width="271" height="59" rx="14" fill="#f97316"/><text x="435" y="202" fill="#fff" font-family="Arial,sans-serif" font-size="15" font-weight="700">Registrar una llave de acceso</text>
<rect x="412" y="245" width="271" height="98" rx="13" fill="#fff9f2" stroke="#e8d7c7"/><text x="428" y="274" fill="#71380f" font-family="Arial,sans-serif" font-size="14" font-weight="700">Después, al iniciar sesión:</text><text x="428" y="304" fill="#2d2019" font-family="Arial,sans-serif" font-size="14">Entrar con la llave de acceso</text><text x="428" y="329" fill="#665850" font-family="Arial,sans-serif" font-size="12">Si no está activa, usa Google o contraseña.</text>

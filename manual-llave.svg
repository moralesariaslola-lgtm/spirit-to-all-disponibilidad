<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
<title id="title">Dónde está la llave de acceso</title><desc id="desc">Inicio, pestaña Accesos rápidos, botón Llave de acceso, ventana para registrar una llave y entrada con llave en la pantalla de inicio de sesión.</desc>
<rect width="720" height="420" fill="#f7f6f4"/>
<rect x="16" y="17" width="324" height="386" rx="22" fill="#fff" stroke="#e6ded6" stroke-width="2"/>

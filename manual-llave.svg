<rect x="32" y="91" width="292" height="46" rx="12" fill="#29211d"/><text x="46" y="120" fill="#fff" font-family="Arial,sans-serif" font-size="16" font-weight="700">Accesos rápidos</text>
<rect x="32" y="157" width="292" height="91" rx="15" fill="#fff4e9" stroke="#f97316" stroke-width="3"/><text x="49" y="192" font-family="Arial,sans-serif" font-size="22">🔑</text><text x="88" y="191" fill="#2d2019" font-family="Arial,sans-serif" font-size="18" font-weight="700">Llave de acceso</text><text x="88" y="221" fill="#665850" font-family="Arial,sans-serif" font-size="14">Entrar con el móvil</text>
<text x="33" y="291" fill="#5d5149" font-family="Arial,sans-serif" font-size="15">Es un botón propio de Inicio.</text><text x="33" y="318" fill="#5d5149" font-family="Arial,sans-serif" font-size="15">Mis dispositivos sirve para avisos push.</text>
<path d="M350 196H378" stroke="#f97316" stroke-width="4"/><path d="M369 187l11 9-11 9" fill="none" stroke="#f97316" stroke-width="4"/>

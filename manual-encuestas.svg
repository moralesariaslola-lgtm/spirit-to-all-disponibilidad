<svg xmlns="http://www.w3.org/2000/svg" width="640" height="408" viewBox="0 0 640 408" role="img" aria-label="Mis encuestas"><rect width="640" height="100%" fill="#f5f5f7"/><rect x="20" y="20" width="600" height="368" rx="24" fill="white" stroke="#e6e1dd"/><text x="48" y="68" font-size="27" font-family="Arial,sans-serif" font-weight="bold" fill="#292524">Mis encuestas</text><text x="48" y="100" font-size="17" font-family="Arial,sans-serif" fill="#6b6b73">Elige una pestaña y abre una fecha</text><rect x="42" y="122" width="556" height="52" rx="13" fill="#fff7ed" stroke="#e4e2df"/><text x="59" y="145" font-size="18" font-family="Arial,sans-serif" font-weight="bold" fill="#252525">Pendientes</text><text x="59" y="164" font-size="13" font-family="Arial,sans-serif" fill="#676767">Te falta responder alguna fecha</text><rect x="42" y="184" width="556" height="52" rx="13" fill="#ffffff" stroke="#e4e2df"/><text x="59" y="207" font-size="18" font-family="Arial,sans-serif" font-weight="bold" fill="#252525">Abiertas</text><text x="59" y="226" font-size="13" font-family="Arial,sans-serif" fill="#676767">Ya has respondido; esperando decisión</text><rect x="42" y="246" width="556" height="52" rx="13" fill="#eaf1ff" stroke="#e4e2df"/><text x="59" y="269" font-size="18" font-family="Arial,sans-serif" font-weight="bold" fill="#252525">Confirmadas</text><text x="59" y="288" font-size="13" font-family="Arial,sans-serif" fill="#676767">Consulta la ficha del bolo</text><rect x="42" y="308" width="556" height="52" rx="13" fill="#ffffff" stroke="#e4e2df"/><text x="59" y="331" font-size="18" font-family="Arial,sans-serif" font-weight="bold" fill="#252525">Histórico</text><text x="59" y="350" font-size="13" font-family="Arial,sans-serif" fill="#676767">Eventos finalizados o cancelados</text></svg>